spring:
  datasource:
    url: jdbc:h2:mem:todomate;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  cache:
    type: none

app:
  cache:
    enabled: false
  seed:
    enabled: true

management:
  health:
    redis:
      enabled: false
