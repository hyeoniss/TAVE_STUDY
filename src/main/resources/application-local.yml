spring:
  datasource:
    url: jdbc:h2:mem:todomate;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

# 로컬에서 페이징 테스트용 투두 65개를 자동 생성한다. 필요 없으면 false로 변경한다.
app:
  seed:
    enabled: true
